<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager — CITAM Buruburu</title>
</head>
<body>
  <!-- Official Netlify Identity widget. Must load BEFORE Decap CMS so the
       CMS reuses this instance instead of injecting a second copy. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    (function () {
      if (!window.netlifyIdentity) {
        console.error('Netlify Identity widget failed to load.');
        return;
      }

      // Fires once the widget has checked the session / processed any
      // invite_token=, confirmation_token= or recovery_token= in the URL hash.
      netlifyIdentity.on('init', function (user) {
        if (user) {
          console.log('Netlify Identity authenticated:', user.email);
        }
      });

      netlifyIdentity.on('login', function (user) {
        console.log('Netlify Identity login:', user.email);
        // On /admin the CMS picks up the login itself; only redirect when
        // we are somewhere else, so this can never create an auth loop.
        if (!window.location.pathname.startsWith('/admin')) {
          window.location.replace('/admin/');
        }
      });

      netlifyIdentity.on('signup', function (user) {
        console.log('Netlify Identity account created:', user.email);
      });

      netlifyIdentity.on('logout', function () {
        console.log('Netlify Identity logout');
        window.location.replace('/admin/');
      });

      // NOTE: no manual netlifyIdentity.init() call here. The CDN widget
      // initializes itself on load, and Decap CMS drives it during boot.
      // Calling init() manually as well runs it twice and corrupts the
      // widget state ("...is not a function" errors).
    })();
  </script>
</body>
</html>
