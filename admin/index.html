<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager — CITAM Buruburu</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    function checkIdentityTokens() {
      const hash = window.location.hash;
      const isIdentityInvite =
        hash.includes('invite_token=') ||
        hash.includes('confirmation_token=') ||
        hash.includes('recovery_token=');

      if (!isIdentityInvite) {
        // No Identity token in hash — proceed with normal init
        netlifyIdentity.init({});
        return;
      }
    }

    netlifyIdentity.on('init', user => {
      if (user) {
        // User is already logged in — redirect to admin dashboard
        window.location.href = '/admin/#/';
      } else {
        // User is not logged in — check for invite token in URL
        checkIdentityTokens();
      }
    });

    // Check for Identity tokens (invite, confirmation, recovery) in the URL hash
    function checkIdentityTokens() {
      const hash = window.location.hash;
      const isIdentityInvite =
        hash.includes('invite_token=') ||
        hash.includes('confirmation_token=') ||
        hash.includes('recovery_token=');

      if (!isIdentityInvite) {
        // No Identity token in hash — start init normally
        netlifyIdentity.init({});
        return;
      }

      // User came from an Identity invitation/confirmation/signup —
      // start init so the widget processes the token from the hash
      netlifyIdentity.init({});
    }

    // Handle login success — redirect to admin dashboard
    netlifyIdentity.on('login', () => {
      if (!window.location.pathname.startsWith('/admin')) {
        window.location.href = '/admin/#/';
      }
    });

    // Optional: handle logout
    netlifyIdentity.on('logout', () => {
      // User logged out — could redirect or just refresh
    });

    // Start Netlify Identity check
    netlifyIdentity.init({});
  </script>
</body>
</html>
